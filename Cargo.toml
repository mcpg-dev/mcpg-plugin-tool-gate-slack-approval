[package]
name = "mcpg-plugin-tool-gate-slack-approval"
version = "0.1.0-alpha.16"
license = "Apache-2.0"
edition = "2024"
description = "Slack-based tool-gate human approval — multi-vtable cdylib plugin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
mcpg-glob = { git = "https://github.com/mcpg-dev/mcpg-glob", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac-sha256 = "1.1.14"
metrics = "0.24"
once_cell = "1.21"
regex = "1.11"
# `blocking` feature: this plugin ships as a sync cdylib. Slack
# API calls + outbound webhook resolution use reqwest's blocking
# client rather than pulling a tokio runtime into every loaded
# artefact (matches guardrails / webhook plugin pattern).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# URL parsing for the callback-destination origin allowlist.
url = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
subtle = "2"
tracing = "0.1"
uuid = { version = "1.23", features = ["v4"] }

[features]
default = ["cdylib-export"]
cdylib-export = ["mcpg-plugin-sdk/cdylib-export"]
